<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHHETRI AI</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

        <div class="robot">🤖</div>

        <h1>Welcome to <span>CHHETRI AI</span></h1>

        <p class="subtitle">
            Your smart AI assistant
        </p>

        <div class="chat-box">

            <input
                type="text"
                id="message"
                placeholder="Ask CHHETRI AI anything..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

        <div class="quick-buttons">

            <button onclick="quickAsk('Ask anything')">
                Ask anything
            </button>

            <button onclick="quickAsk('Write something')">
                Write something
            </button>

            <button onclick="quickAsk('Get help')">
                Get help
            </button>

        </div>

        <div id="response"></div>

    </main>

    <footer>
        © 2026 CHHETRI AI
    </footer>

    <script src="./script.js"></script>

</body>
</html>
